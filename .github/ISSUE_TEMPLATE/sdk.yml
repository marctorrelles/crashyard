name: An SDK or tool that doesn't work
description: A Sentry SDK, sentry-cli or a build plugin that fails against crashyard
labels: [compatibility]
body:
  - type: input
    attributes:
      label: SDK or tool, and its version
      placeholder: '@sentry/browser 10.2.0, sentry-cli 2.50.0, …'
    validations:
      required: true
  - type: textarea
    attributes:
      label: What it sent and what crashyard answered
      description: The request, an envelope or an API call, and the response. Remove any secrets first.
    validations:
      required: true
