# Releases from the commits: release-please keeps a pull request with the next version and its changelog, and merging
# it tags the release and makes it on GitHub (which the dashboard's update check reads). Each release then gets its
# build, `crashyard.json.gz`, what the dashboard's Update installs (src/update/install.ts), and a release that changes
# symcache/ says so in its notes, as its builder image is only built on deploy. Skips itself until public, and in
# copies of the repo.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-please:
    if: ${{ !github.event.repository.private && github.repository == 'marctorrelles/crashyard' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0
      - if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/release-bundle.mjs crashyard.json.gz
          gh release upload "$TAG" crashyard.json.gz
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          if ! git diff --quiet "$previous" "$TAG" -- symcache; then
            gh release view "$TAG" --json body --jq .body > notes.md
            printf '\n\n**This release changes the SymCache builder.** If you run it, update with a deploy, with Docker running, so the deploy builds its new image.\n' >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
