# Pull request titles follow Conventional Commits (fix:, feat:, …): they become the squashed commit and the changelog
name: PR title
on:
  pull_request_target:
    types: [opened, edited, synchronize]
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
