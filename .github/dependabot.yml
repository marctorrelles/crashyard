version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /symcache
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /symcache
    schedule:
      interval: weekly
